<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8fd3ff" />
  <title>Blocky Tanks</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #8fd3ff;
      overscroll-behavior: none; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
    }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }

    /* Переключение схем: на сенсорных устройствах <body class="touch"> */
    .touch-only { display: none; }
    body.touch .touch-only { display: block; }
    body.touch .desktop-only { display: none !important; }

    .panel {
      background: rgba(0,0,0,.38); border-radius: 12px; padding: .35em .8em;
      text-shadow: 0 1px 2px rgba(0,0,0,.5); font-weight: 700;
    }
    .hud-score {
      position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
      font-size: clamp(16px, 4.2vmin, 30px); display: flex; flex-direction: column; gap: 2px;
    }
    .hud-score small { font-size: .6em; font-weight: 600; opacity: .85; }
    .hud-score .hud-mode { font-size: .5em; opacity: .75; }
    /* Экран проще: режим/карта/правила — первые 15 с боя, подсказки управления — в первых боях (ui.declutter) */
    .hud-score.compact .hud-mode { display: none; }
    .hint { transition: opacity .8s; }
    .hint.faded { opacity: 0; pointer-events: none; }
    .hud-buttons {
      position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
      display: flex; gap: 6px; z-index: 5;
    }
    .hud-btn {
      pointer-events: auto; cursor: pointer; border: 0; color: #fff;
      font: 700 clamp(12px, 3vmin, 18px) system-ui, sans-serif;
      background: rgba(0,0,0,.38); border-radius: 12px; padding: .5em .9em;
    }
    /* Таймер боя и значки эффектов — сверху по центру, друг под другом */
    .hud-top {
      position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
    }
    /* Полоса боя: счёт красных · таймер · счёт синих */
    .match-bar { display: flex; align-items: center; gap: .7em; font-size: clamp(18px, 4.6vmin, 30px); font-variant-numeric: tabular-nums; }
    .team-score { min-width: 1.6em; text-align: center; border-radius: 8px; padding: 0 .35em; font-weight: 900; }
    .team-score.red { background: rgba(229,57,53,.85); }
    .team-score.blue { background: rgba(30,136,229,.85); }
    .match-timer { letter-spacing: .03em; }
    .match-timer.warn { color: #ff8a80; animation: buff-blink 1s steps(2) infinite; }
    /* Таблицы команд (Tab и итоги) */
    .team-block { margin-bottom: .5rem; }
    .team-head { display: flex; justify-content: space-between; gap: 1rem; font-weight: 900; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.2); padding-bottom: .2rem; margin-bottom: .2rem; }
    .results-score { font-size: clamp(22px, 5vmin, 36px); font-weight: 900; }
    .results-teams { display: flex; flex-wrap: wrap; gap: 1.2rem; justify-content: center; max-height: 50vh; overflow-y: auto; }
    .buff-container { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .kill-feed {
      position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 3em); right: max(10px, env(safe-area-inset-right));
      display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none; font-size: clamp(11px, 2.4vmin, 15px);
    }
    .kill-row { background: rgba(0,0,0,.45); border-radius: 8px; padding: .2em .6em; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
    .kill-row b { color: #ffd54f; }
    /* Панели команд по бокам: слева союзники, справа противник (src/client/ui.ts → updateTeamPanels) */
    .team-panel {
      position: absolute; top: 50%; transform: translateY(-58%); width: clamp(150px, 19vw, 230px);
      display: flex; flex-direction: column; gap: 2px; pointer-events: none;
      font-size: clamp(11px, 1.6vmin, 14px); font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.7);
    }
    .team-panel.mine { left: max(8px, env(safe-area-inset-left)); }
    .team-panel.enemy { right: max(8px, env(safe-area-inset-right)); }
    .team-panel:empty { display: none; }
    body.no-team-panels .team-panel { display: none; }
    /* Свернуть список команды / панель счёта: нажатие на заголовок, H — всё сразу (ui.initCollapse) */
    .tp-head { pointer-events: auto; cursor: pointer; }
    .tp-head::after { content: '▾'; opacity: .7; margin: 0 .2em; }
    .team-panel.collapsed .tp-head::after { content: '▸'; }
    .team-panel.collapsed .tp-row { display: none; }
    .hud-score { pointer-events: auto; cursor: pointer; }
    .hud-score.collapsed small { display: none; }
    /* Мини-карта (src/client/minimap.ts): ПК — слева снизу; телефон — над джойстиком / справа от списка союзников */
    .minimap { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: clamp(140px, 17vw, 200px); height: auto; aspect-ratio: 1;
      border-radius: 8px; border: 2px solid rgba(255,255,255,.45); box-shadow: 0 2px 10px rgba(0,0,0,.5); opacity: .92; pointer-events: none; z-index: 5; }
    body:not(.with-minimap) .minimap, body.in-zoom .minimap { display: none; }
    body.touch .minimap, body.minimap-edit .minimap { pointer-events: auto; touch-action: none; cursor: grab; }
    body.minimap-edit .minimap { outline: 2px dashed #ffe082; outline-offset: 3px; }
    .minimap.dragging { cursor: grabbing; outline: 2px solid #ffe082; outline-offset: 3px; opacity: 1; }
    body.touch .minimap { width: 104px; bottom: calc(max(6px, env(safe-area-inset-bottom)) + 52px + clamp(88px, 24vmin, 128px) + 14px); left: max(5vmin, env(safe-area-inset-left)); }
    @media (max-width: 600px) { body.touch .minimap { bottom: calc(max(6px, env(safe-area-inset-bottom)) + 96px + clamp(88px, 24vmin, 128px) + 12px); } }
    @media (orientation: landscape) and (max-height: 560px) {
      body.touch .minimap { width: 92px; bottom: auto; top: calc(max(10px, env(safe-area-inset-top)) + 64px); left: calc(max(8px, env(safe-area-inset-left)) + clamp(170px, 22vw, 240px) + 10px); }
      body.touch.no-team-panels .minimap { left: max(8px, env(safe-area-inset-left)); }
    }
    .tp-head { font-weight: 900; font-size: 1.05em; padding: 0 .2em .1em; display: flex; justify-content: space-between; }
    .team-panel.enemy .tp-head { flex-direction: row-reverse; }
    .tp-row {
      display: grid; grid-template-columns: 4px 3.6em minmax(0, 1fr) auto; grid-template-rows: auto 3px; column-gap: .35em;
      align-items: center; background: rgba(0,0,0,.38); border-radius: 6px; padding: .15em .4em .2em .2em;
    }
    .team-panel.enemy .tp-row { background: rgba(70,0,0,.38); }
    .tp-class { grid-row: 1 / 3; align-self: stretch; border-radius: 2px; }
    .tp-tank { color: #ffe082; white-space: nowrap; overflow: hidden; }
    .tp-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tp-status { font-size: .9em; }
    .tp-hp { grid-column: 2 / 5; height: 3px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
    .tp-hp i { display: block; height: 100%; background: #66bb6a; transition: width .25s; }
    .team-panel.enemy .tp-hp i { background: #ef5350; }
    .tp-row.me { outline: 1px solid rgba(255,213,79,.8); }
    .tp-row.me .tp-name { color: #ffd54f; }
    .tp-row.dead { opacity: .5; }
    .tp-row.dead .tp-name, .tp-row.dead .tp-tank { text-decoration: line-through; color: #bbb; }

    /* Индикатор входящего урона: 8 секторов вокруг прицела, сектор смотрит туда, откуда стреляли */
    .dmg-ring { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; --r: clamp(84px, 17vmin, 150px); }
    .dmg-sector { position: absolute; left: 0; top: 0; width: 0; height: 0; transform: rotate(var(--a)); opacity: 0; transition: opacity .6s ease-out; }
    .dmg-sector.show { opacity: 1; transition: opacity .12s; }
    .dmg-arc {
      position: absolute; width: calc(var(--r) * .78); height: calc(var(--r) * .32); left: calc(var(--r) * -.39); top: calc(var(--r) * -1.06);
      border-top: 7px solid rgba(255,45,30,.92); border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      filter: drop-shadow(0 0 6px rgba(255,40,20,.9));
    }
    .dmg-sector.flash .dmg-arc { animation: dmg-flash .5s ease-out; }
    /* Не пробили (Ф1.4): броня выдержала — белая дуга и подпись «рикошет» / «не пробил» */
    .dmg-sector.blocked .dmg-arc { border-top-color: rgba(255,255,255,.95); filter: drop-shadow(0 0 6px rgba(255,255,255,.8)); }
    .dmg-sector.blocked .dmg-num { color: #fff; font-size: clamp(12px, 2.1vmin, 17px); }
    @keyframes dmg-flash { 0% { border-top-width: 12px; } 100% { border-top-width: 7px; } }
    .dmg-num {
      position: absolute; left: 0; top: calc(var(--r) * -1.3); transform: translate(-50%, -50%) rotate(calc(-1 * var(--a)));
      color: #ff5a4a; font-weight: 900; font-size: clamp(14px, 2.6vmin, 22px); white-space: nowrap;
      text-shadow: 0 0 3px #000, 0 1px 2px #000;
    }
    /* Кружок прицела = круг разброса: размер меняет код (сводится стоя на месте), сведён — зеленеет */
    .crosshair {
      position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px;
      border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 3px rgba(0,0,0,.6);
      pointer-events: none; transition: border-color .15s;
    }
    .crosshair.converged { border-color: rgba(129,255,140,.95); }
    /* Кольцо полного сведения (минимальный круг) и время до него */
    .aim-min { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 1px dashed rgba(255,255,255,.55); border-radius: 50%; pointer-events: none; display: none; }
    .aim-time { position: absolute; right: calc(100% + 8px); top: calc(50% - 7px); font-size: 11px; font-weight: 800; color: #e0e0e0; text-shadow: 0 1px 3px rgba(0,0,0,.9); white-space: nowrap; }
    /* Препятствие на линии огня: серый перечёркнутый прицел */
    .crosshair.blocked { border-color: rgba(160,160,160,.95) !important; border-style: dashed; }
    .crosshair.blocked::before { content: ""; position: absolute; left: -15%; top: 50%; width: 130%; height: 2px; background: rgba(200,200,200,.9); transform: rotate(-45deg); }
    .crosshair.blocked .range-text { color: #bdbdbd; }
    /* Зум: чистый экран — без панелей команд, счёта и подсказок */
    body.in-zoom .team-panel, body.in-zoom .hud-score, body.in-zoom .hint, body.in-zoom .lock-hint, body.in-zoom .kill-feed,
    body.in-zoom .hud-buttons, body.in-zoom .tutorial-tip, body.in-zoom .match-bar { opacity: 0; pointer-events: none; transition: opacity .2s; }
    /* Подсказка пробития (Ф1.4): прицел на противнике — цвет по броне точки под ним (важнее цвета сведения) */
    .crosshair.pen-yes { border-color: rgba(76,255,90,1); border-width: 3px; }
    .crosshair.pen-maybe { border-color: rgba(255,214,0,1); border-width: 3px; }
    .crosshair.pen-no { border-color: rgba(255,60,50,1); border-width: 3px; }
    /* Надписи исхода попадания над точкой удара: «Пробитие», «Не пробил», «Рикошет!» */
    .hit-label {
      position: absolute; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
      font-weight: 900; font-size: clamp(13px, 2.4vmin, 20px); text-shadow: 0 0 3px #000, 0 1px 2px #000; opacity: 0; transition: opacity .15s;
    }
    .hit-label.pen { color: #ff7043; }
    .hit-label.nopen { color: #eceff1; }
    .hit-label.ricochet { color: #80deea; }
    .crosshair::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
      background: #ff5252; border-radius: 50%;
    }
    /* Риски падения снаряда: где будет снаряд выбранного типа на 100 / 200 / 300 м (считает код по баллистике) */
    .drop-mark {
      position: absolute; width: 14px; height: 2px; margin-left: -7px; background: rgba(255, 235, 59, .9);
      box-shadow: 0 0 2px rgba(0,0,0,.8); pointer-events: none; display: none;
    }
    .drop-mark span {
      position: absolute; left: 17px; top: -6px; font-size: 9px; font-weight: 800; color: #fff59d;
      text-shadow: 0 1px 2px rgba(0,0,0,.9); white-space: nowrap;
    }
    .range-text.on-target { color: #81ff8c; }
    .range-text {
      position: absolute; left: calc(100% + 8px); top: calc(50% - 7px); font-size: 11px; font-weight: 800;
      color: #ffd54f; text-shadow: 0 1px 3px rgba(0,0,0,0.9); white-space: nowrap;
    }
    .reload {
      position: absolute; left: 50%; top: calc(50% + 24px); width: 70px; height: 6px; margin-left: -35px;
      background: rgba(0,0,0,.4); border-radius: 3px;
    }
    .reload-fill { height: 100%; width: 100%; background: #ffd54f; border-radius: 3px; }
    /* Секунды перезарядки — справа от полоски */
    .reload-text {
      position: absolute; left: calc(100% + 6px); top: 50%; transform: translateY(-50%);
      font-size: 12px; font-weight: 800; color: #ff8a80; white-space: nowrap; font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 3px rgba(0,0,0,.9);
    }
    .reload-text.ready { color: #ffd54f; }
    /* Зум: затемнённые края «как в оптике» и надпись увеличения под прицелом */
    .scope {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,.35) 62%, rgba(0,0,0,.8) 100%);
    }
    .zoom-indicator { display: none; font-size: clamp(12px, 2.8vmin, 16px); color: #e0f7fa; pointer-events: none; }
    .zoom-btn {
      position: fixed; right: max(5vmin, env(safe-area-inset-right)); bottom: calc(max(9vmin, env(safe-area-inset-bottom)) + clamp(84px, 21vmin, 130px) + 12px);
      width: clamp(52px, 13vmin, 76px); height: clamp(52px, 13vmin, 76px); border-radius: 50%;
      border: 3px solid rgba(255,255,255,.6); background: rgba(0,0,0,.45); color: #fff; font-size: clamp(20px, 5vmin, 30px);
      pointer-events: auto; touch-action: none; z-index: 6;
    }
    .zoom-btn.active { background: rgba(0,172,193,.8); }
    .cam-btn {
      position: fixed; right: calc(max(5vmin, env(safe-area-inset-right)) + clamp(52px, 13vmin, 76px) + 10px); bottom: calc(max(9vmin, env(safe-area-inset-bottom)) + clamp(84px, 21vmin, 130px) + 12px);
      width: clamp(44px, 11vmin, 62px); height: clamp(44px, 11vmin, 62px); border-radius: 50%;
      border: 3px solid rgba(255,255,255,.6); background: rgba(0,0,0,.45); color: #fff; font-size: clamp(18px, 4.4vmin, 26px);
      pointer-events: auto; touch-action: none; z-index: 6;
    }
    /* Кнопки «+» / «−» столбиком чуть выше лупы — только на телефоне и только в зуме */
    .zoom-steps {
      position: fixed; right: max(5vmin, env(safe-area-inset-right));
      bottom: calc(max(9vmin, env(safe-area-inset-bottom)) + clamp(84px, 21vmin, 130px) + clamp(52px, 13vmin, 76px) + 22px);
      width: clamp(52px, 13vmin, 76px); flex-direction: column; align-items: center; gap: 8px;
      pointer-events: auto; z-index: 6;
    }
    /* «+» / «−» — в ряд слева от лупы, на месте кнопки камеры (в зуме она не нужна и прячется) */
    body.touch .zoom-steps { flex-direction: row; width: auto; right: calc(max(5vmin, env(safe-area-inset-right)) + clamp(52px, 13vmin, 76px) + 10px); bottom: calc(max(9vmin, env(safe-area-inset-bottom)) + clamp(84px, 21vmin, 130px) + 12px); }
    body.touch.in-zoom .cam-btn { display: none; }
    body.touch .zoom-steps { display: none; }
    body.touch .zoom-steps.shown { display: flex; }
    .zoom-step {
      width: clamp(44px, 11vmin, 60px); height: clamp(44px, 11vmin, 60px); border-radius: 50%;
      border: 2px solid rgba(255,255,255,.6); background: rgba(0,0,0,.5); color: #fff;
      font: 800 clamp(22px, 6vmin, 32px) system-ui, sans-serif; line-height: 1; touch-action: none;
    }
    .zoom-step:active { background: rgba(0,172,193,.8); }
    .zoom-step.limit { opacity: .35; }
    /* Куда наводится прицел (камера); кружок .crosshair — куда реально смотрит ствол, он догоняет */
    .aim-marker {
      position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
      border: 2px solid rgba(255,255,255,.55); border-radius: 50%; pointer-events: none; display: none;
    }
    /* Панель снарядов снизу по центру */
    .shell-bar {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(max(10px, env(safe-area-inset-bottom)) + 3.6em);
      display: flex; gap: 6px; pointer-events: auto; z-index: 6;
    }
    body.touch .shell-bar { bottom: max(10px, env(safe-area-inset-bottom)); gap: 12px; }
    /* Телефон: снаряды крупнее и с промежутком — меньше промахов пальцем (разбор Gemini 2026-10-14); размер кнопок — в настройках (--ctl) */
    body.touch .shell-slot { min-height: 42px; box-sizing: border-box; }
    body.touch .joy-base, body.touch .fire-btn, body.touch .zoom-btn, body.touch .cam-btn, body.touch .shell-bar { zoom: var(--ctl, 1); }
    .shell-slot {
      position: relative; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto;
      align-items: center; column-gap: 6px; min-width: 84px; padding: 5px 20px 5px 7px; cursor: pointer;
      background: rgba(0,0,0,.45); color: #fff; border: 2px solid rgba(255,255,255,.18); border-radius: 10px;
      font: 800 13px system-ui, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.7); touch-action: none;
    }
    .shell-slot.active { border-color: var(--shell); box-shadow: 0 0 10px var(--shell); background: rgba(0,0,0,.6); }
    .shell-slot.empty { opacity: .4; }
    /* Подсказка: этим снарядом пробьёшь цель под прицелом */
    .shell-slot.suggest { animation: shell-suggest .8s ease-in-out infinite alternate; border-color: var(--shell); }
    @keyframes shell-suggest { from { box-shadow: 0 0 0 var(--shell); } to { box-shadow: 0 0 14px var(--shell); transform: translateY(-3px); } }
    .shell-key { position: absolute; top: -8px; left: -6px; background: #263238; border-radius: 5px; padding: 0 4px; font-size: 10px; }
    .shell-icon { grid-row: span 2; width: 8px; height: 26px; border-radius: 4px 4px 1px 1px; background: linear-gradient(180deg, #fff 0%, var(--shell) 35%, #5d4037 100%); }
    .shell-label { font-size: 15px; color: var(--shell); }
    .shell-dmg { font-size: 11px; opacity: .85; grid-column: 2; }
    .shell-ammo { position: absolute; right: 5px; top: 3px; font-size: 11px; opacity: .8; }
    /* HP бар — прикреплён к прицелу, синяя обводка, с текстом HP */
    .hp-bar {
      position: absolute; left: 50%; top: calc(50% + 36px); width: 120px; height: 22px; margin-left: -60px;
      background: rgba(0,0,0,.4); border-radius: 5px; overflow: hidden;
      border: 2px solid #2196f3; box-shadow: 0 0 6px rgba(33,150,243,.6), inset 0 0 4px rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
    }
    .hp-fill { position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: #66bb6a; transition: width .2s, background .2s; z-index: 1; }
    .hp-text { position: relative; z-index: 2; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9); pointer-events: none; white-space: nowrap; }
    .banner {
      position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center;
      font-size: clamp(18px, 5vmin, 36px); font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,.6);
      white-space: pre-line; max-width: 90vw;
    }
    .hint {
      position: absolute; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      font-size: clamp(11px, 2.2vmin, 15px); text-align: center; max-width: 94vw;
    }
    .lock-hint {
      position: absolute; left: 50%; top: 60%; transform: translateX(-50%);
      font-size: clamp(14px, 3vmin, 22px);
    }

    }
    /* Выбор танка на следующую жизнь */

    /* 3.6: Скорборд */
    .scoreboard {

    /* Итоги боя */

      max-height: 96vh; max-height: 96dvh; overflow-y: auto; overflow-x: hidden; }
    /* Телефон горизонтально: итоги не влезали по высоте (заголовок и «В главное меню» за краем) — плотнее и с прокруткой */
    @media (max-height: 500px) {

    /* Кампания (Ф4): глава, экипаж, бои, письмо */
    .campaign { display: flex; flex-direction: column; gap: 10px; width: min(640px, 94vw); }
    .camp-head { display: flex; align-items: baseline; gap: 10px; }
    .camp-chapter { font-size: 22px; font-weight: 800; color: #ffd54f; }

    .crew-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    @media (max-width: 520px) { .crew-row { grid-template-columns: repeat(2, 1fr); } }
    .crew-card { display: flex; flex-direction: column; align-items: center; padding: 6px; border-radius: 8px; background: rgba(0,0,0,.35); font-size: 13px; text-align: center; }
    .crew-card small { opacity: .7; font-size: 11px; } .crew-icon { font-size: 20px; }
    .camp-list { display: flex; flex-direction: column; gap: 4px; }
    .camp-battle { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.3); }
    .camp-battle small { display: block; opacity: .75; font-size: 12px; }
    .camp-battle.locked { opacity: .45; } .camp-battle.current { outline: 2px solid #ffd54f; } .camp-battle.done .camp-num { background: #43a047; }
    .camp-num { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.15); display: grid; place-items: center; font-weight: 700; flex: none; }
    .camp-card { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: rgba(28,24,16,.9); border: 1px solid rgba(214,180,110,.5); }
    .camp-letter { font-size: 14px; line-height: 1.45; } .camp-letter small { display: block; text-align: right; opacity: .7; }
    .crew-stars { color: #ffd54f; letter-spacing: 1px; font-size: 13px; } .crew-skill { font-style: italic; }
    .camp-report { padding: 8px 12px; font-size: 13px; line-height: 1.5; background: rgba(20,30,20,.9); border: 1px solid rgba(255,213,79,.4); }
    .camp-fallen { font-size: 12px; opacity: .75; }
    /* Карта фронта (Ф4): пергамент, реки, граница, стрелки наступления, точки боёв */
    .front-map { width: 100%; height: auto; border-radius: 10px; border: 1px solid rgba(214,180,110,.4); }
    .fm-bg { fill: #e8dcc0; } .fm-region { fill: #8d7b55; font: italic 16px sans-serif; opacity: .6; }
    .fm-river { fill: none; stroke: #6a9cc2; stroke-width: 3; stroke-linejoin: round; } .fm-rivername { fill: #4a7aa0; font: italic 12px sans-serif; }
    .fm-border { fill: none; stroke: #7b5c3a; stroke-width: 2; stroke-dasharray: 8 4; } .fm-note { fill: #7b5c3a; font: 11px sans-serif; }
    .fm-arrow { fill: none; stroke: #5d4037; stroke-width: 7; stroke-opacity: .35; stroke-linecap: round; } .fm-arrowhead { fill: #5d4037; fill-opacity: .5; }
    .fm-city { fill: #3e2f1c; } .fm-cityname { fill: #3e2f1c; font: 600 12px sans-serif; }
    .fm-route { fill: none; stroke: #b71c1c; stroke-width: 2.5; stroke-dasharray: 6 5; }
    .fm-node circle { stroke: #fff; stroke-width: 2; } .fm-node text { text-anchor: middle; font: 700 13px sans-serif; fill: #fff; }
    .fm-node .fm-label { fill: #3e2f1c; font: 700 11px sans-serif; paint-order: stroke; stroke: #e8dcc0; stroke-width: 3px; }
    .fm-node.done circle { fill: #43a047; } .fm-node.locked circle { fill: #9e9e9e; } .fm-node.current { cursor: pointer; }
    .fm-node.current circle { fill: #f9a825; animation: fm-pulse 1.2s ease-in-out infinite alternate; }
    @keyframes fm-pulse { from { stroke-width: 2; } to { stroke-width: 6; stroke: #fff59d; } }
    /* Телефон: карта ужимается почти вдвое — крупнее подписи и точки (по ним касаются пальцем) */
    @media (max-width: 560px) {
      .fm-cityname { font-size: 18px; } .fm-node .fm-label { font-size: 17px; } .fm-node text { font-size: 19px; }
      .fm-node circle { r: 19px; } .fm-rivername, .fm-note { font-size: 16px; } .fm-region { font-size: 22px; }
    }
    .fm-lake { fill: #a9c7de; stroke: #6a9cc2; stroke-width: 1.5; }
    .camp-chapters { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
    .camp-ch { padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.3); opacity: .6; }
    .camp-ch.cur { opacity: 1; outline: 1px solid #ffd54f; } .camp-ch.done { opacity: .85; color: #a5d6a7; }
    .camp-garage { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: rgba(0,0,0,.35); }
    .garage-bar { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
    .garage-track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; } .garage-fill { height: 100%; }
    .garage-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    .camp-garage small { opacity: .7; font-size: 12px; }
    #hitcam { position: absolute; left: 12px; bottom: 16px; width: 280px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,213,79,.6); background: rgba(10,14,10,.75); z-index: 7; pointer-events: none; }
    #hitcam canvas { display: block; width: 280px; height: 190px; }
    .hitcam-caption { padding: 4px 8px 6px; font-size: 12px; color: #fff; line-height: 1.3; }
    .hitcam-caption b { color: #ffd54f; }
    @media (max-width: 700px) { #hitcam { left: 50%; transform: translateX(-50%); top: 70px; bottom: auto; width: 220px; } #hitcam canvas { width: 220px; height: 149px; } }
    /* pointer-events: auto — #hud прозрачен для касаний, без этого палец и мышь проходили сквозь кнопки к зоне наводки */
    /* ПК: ряд в правом нижнем углу (столбиком на середине справа наезжал на список противников) */
    #support-bar { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: row; gap: 6px; z-index: 6; pointer-events: auto; }
    .support-btn { position: relative; width: 46px; height: 46px; border-radius: 10px; border: 1px solid rgba(255,213,79,.5); background: rgba(0,0,0,.5); font-size: 22px; cursor: pointer; padding: 0; color: #fff; }
    .support-btn.off { opacity: .35; }
    .support-btn .sup-key { position: absolute; left: 3px; top: 1px; font-size: 10px; color: #ffd54f; }
    .support-btn .sup-n { position: absolute; right: 4px; bottom: 1px; font-size: 11px; font-weight: 800; color: #ffd54f; }
    @media (max-width: 700px) { #support-bar { bottom: 220px; right: 8px; } .support-btn { width: 40px; height: 40px; font-size: 19px; } .support-btn .sup-key { display: none; } }
    /* Телефон и планшет: столбик поддержки в альбомной ориентации не помещается по высоте и наезжал на лупу и «+/−» —
       ставим его рядом вверху справа, под кнопками «Звук / Меню»; лента боя — ниже ряда */
    body.touch #support-bar { flex-direction: row; top: calc(max(10px, env(safe-area-inset-top)) + 40px); bottom: auto; right: max(10px, env(safe-area-inset-right)); gap: 5px; }
    body.touch .support-btn { width: 38px; height: 38px; font-size: 18px; }
    body.touch .support-btn .sup-key { display: none; }
    body.touch .kill-feed { top: calc(max(10px, env(safe-area-inset-top)) + 86px); }
    /* Низкое окно на компьютере — столбик тоже не помещается (залезал на «Меню»): тот же ряд под кнопками */
    @media (max-height: 560px) {
      #support-bar { flex-direction: row; top: calc(max(10px, env(safe-area-inset-top)) + 44px); bottom: auto; right: max(10px, env(safe-area-inset-right)); gap: 5px; }
      .support-btn { width: 40px; height: 40px; font-size: 19px; }
      .kill-feed { top: calc(max(10px, env(safe-area-inset-top)) + 92px); }
    }
    #modules-hud { position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; z-index: 5; }
    #modules-hud .mod { background: rgba(0,0,0,.55); border: 1px solid rgba(255,213,79,.5); border-radius: 8px; padding: 2px 8px; font-size: 13px; font-weight: 700; color: #ffd54f; }
    #modules-hud .mod.bad { border-color: #ef5350; color: #ff8a80; }
    .ws-row { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .ws-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .camp-goal { font-weight: 700; color: #ffe082; }
    .camp-or { display: block; opacity: .6; font-size: 11px; margin: 2px 0; }
    .camp-choose { font-weight: 800; color: #ffd54f; text-align: center; }
    .camp-note { font-size: 12px; color: #a5d6a7; } .camp-forces, .camp-rule { font-size: 12px; opacity: .8; }
    /* Захват (Ф3a): полоса под счётом — две шкалы, красная и синяя */
    /* Атрибут hidden сильнее любых display: у панелей с display:flex (полоса захвата) он иначе не работал — «Захват» висел в обычном бою */
    [hidden] { display: none !important; }
    .capture-bar { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 10px; margin-top: 4px; min-width: 190px; }
    .capture-bar .cap-label { font-size: 12px; font-weight: 700; }

    .capture-bar .cap-fill.red { background: #e53935; } .capture-bar .cap-fill.blue { background: #1e88e5; }
    .capture-bar.contested { box-shadow: 0 0 10px #ffd54f; }
    /* Видимость (Ф2.2): «вас заметили» и метка «?» пропавшего из виду противника */
    #seen-ind { position: fixed; top: 138px; left: 50%; transform: translateX(-50%) scale(.6); font-size: 30px; opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s; filter: drop-shadow(0 0 6px #ffd54f); z-index: 30; }

    .results-rate { display: flex; align-items: center; gap: .5rem; font-size: 15px; }

    /* Просьба об отзыве (после 3-го и 10-го боя) */
    .results-ask { display: flex; flex-direction: column; align-items: center; gap: .45rem; padding: .6rem .8rem; border-radius: 10px;
      background: rgba(255,213,79,.1); border: 1px solid rgba(255,213,79,.45); }

    .results-ask-tg a { color: #90caf9; }
    .results-ask-later .chip { font-size: 12px; opacity: .75; }
    /* Брифинг перед боем: историческая справка о карте */
    .briefing { position: fixed; top: 4.5rem; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); z-index: 40;
      padding: .9rem 1.1rem; background: rgba(28,24,16,.9); border: 1px solid rgba(214,180,110,.5); color: #f3ead6; cursor: pointer;
      transition: opacity .6s; animation: briefing-in .5s ease-out; }

    .goal-banner { position: fixed; top: 4.5rem; left: 50%; transform: translateX(-50%); z-index: 40; pointer-events: none;
      width: max-content; max-width: min(620px, calc(100vw - 32px)); box-sizing: border-box; padding: .55rem 1rem; border-radius: 10px; background: rgba(20,24,18,.82);
      border: 1px solid rgba(255,224,130,.45); color: #ffe082; font-size: clamp(15px, 3.4vmin, 21px); font-weight: 800; text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,.7); transition: opacity .6s; }

    .cap-mark { position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; display: flex; flex-direction: column; align-items: center;

    /* Сенсорное управление */
    .joy-zone { position: absolute; left: 0; top: 0; width: 50%; height: 100%; pointer-events: auto; touch-action: none; z-index: 1; }
    .aim-zone { position: absolute; right: 0; top: 0; width: 50%; height: 100%; pointer-events: auto; touch-action: none; z-index: 1; }
    /* Джойстик движения: постоянный, в левом нижнем углу — зелёное кольцо, 4 стрелки, ручка */
    .joy-base {
      position: fixed; left: max(5vmin, env(safe-area-inset-left)); bottom: max(9vmin, env(safe-area-inset-bottom));
      width: clamp(88px, 24vmin, 128px); height: clamp(88px, 24vmin, 128px); /* на 20% меньше (владелец 2026-10-14) */
      border-radius: 50%; background: rgba(20, 70, 45, .35); border: 4px solid rgba(61, 220, 151, .9);

    .joy-knob {
      position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%;

    .joy-arrows .up    { top: 5%;    left: 50%; margin-left: -10px; border-bottom-color: #3ddc97; border-top: none; }

    .joy-arrows .left  { left: 5%;   top: 50%;  margin-top: -10px;  border-right-color: #3ddc97;  border-left: none; }
    .joy-arrows .right { right: 5%;  top: 50%;  margin-top: -10px;  border-left-color: #3ddc97;   border-right: none; }

    .fire-btn {
      position: fixed; right: max(5vmin, env(safe-area-inset-right)); bottom: max(9vmin, env(safe-area-inset-bottom));
      width: clamp(84px, 21vmin, 130px); height: clamp(84px, 21vmin, 130px);
      border-radius: 50%; border: 4px solid rgba(255,255,255,.7); background: rgba(229,57,53,.75);
      color: #fff; font: 800 clamp(13px, 3vmin, 18px) system-ui, sans-serif;

    .nation-flag { width: 120px; height: 80px; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,.5); }
    .nation-head .nation-flag { width: 42px; height: 28px; border-radius: 3px; }
    .nation-title { font-size: clamp(20px, 4vmin, 28px); font-weight: 900; color: #ffd54f; }
    .nation-sub { font-size: 13px; opacity: .8; }
    .nation-tanks { display: flex; flex-wrap: wrap; justify-content: center; gap: .35rem; font-size: 12px; }
    .nation-tanks span { background: rgba(255,255,255,.08); border-radius: 10px; padding: 2px 8px; }
    .nation-head { grid-column: 1 / -1; display: flex; align-items: center; gap: .7rem; font-size: 18px; color: #ffd54f; }
    @media (min-width: 700px) { .tank-cards:not(.nation-picks) { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
    .tank-card.compact { padding: .75rem .85rem; gap: .35rem; border-radius: 12px; }
    .tank-card.compact .tank-card-icon { font-size: 1.5rem; }
    .tank-card.compact .tank-card-name { font-size: 15px; }
    .tank-card.compact .tank-card-desc { font-size: 11px; min-height: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tank-card.compact .tank-card-stats { grid-template-columns: 1fr 1fr 1fr; font-size: 10.5px; gap: .15rem .5rem; }
    .tank-card.compact .tank-card-stats .stat { flex-direction: column; align-items: flex-start; }

    .menu-screen { display: none; flex-direction: column; align-items: center; gap: 1rem; width: 100%; max-width: 1100px; }
    .menu-note { margin: -.6rem 0 0; font-size: 13px; opacity: .75; text-align: center; }
    .menu-error { margin: 0; min-height: 1.2em; color: #ffab91; font-weight: 700; text-align: center; max-width: 600px; }
    .name-input {
      padding: .6rem 1rem; font-size: 1.1rem; border-radius: 8px; border: 2px solid rgba(255,213,79,.3);
      background: rgba(0,0,0,.4); color: #fff; max-width: 320px; width: 100%; text-align: center;
    }
    .mode-buttons { display: grid; grid-template-columns: 1fr; gap: 1rem; width: 100%; max-width: 640px; }
    @media (min-width: 640px) { .mode-buttons { grid-template-columns: 1fr 1fr; } }
    .mode-btn, .theme-card {
      display: flex; flex-direction: column; align-items: center; gap: .4rem; cursor: pointer; color: #fff;
      background: rgba(0,0,0,.4); border: 2px solid rgba(255,213,79,.3); border-radius: 14px; padding: 1.2rem;
      font: inherit; transition: transform .15s, border-color .15s, background .15s;
    }
    /* Мультиплеер без сервера (сайт, itch.io): кнопка видна, но неактивна */
    .mode-btn.disabled, .mode-btn.disabled:hover { opacity: .45; cursor: not-allowed; filter: grayscale(.6); transform: none; }
    .mode-btn:hover, .theme-card:hover { transform: translateY(-3px); border-color: #ffd54f; background: rgba(255,213,79,.12); }
    .mode-icon { font-size: 2.6rem; line-height: 1; }
    .mode-title { font-size: 1.25rem; font-weight: 900; color: #ffd54f; }
    .mode-desc { font-size: 13px; opacity: .8; text-align: center; }
    .theme-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .8rem; width: 100%; max-width: 900px; }
    .theme-card { background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 45%, var(--ground) 45%, var(--ground) 100%); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    .theme-card.selected, .chip.selected { border-color: #ffd54f; box-shadow: 0 0 0 3px rgba(255,213,79,.45); }
    .theme-icon { font-size: 2.2rem; }
    .theme-name { font-size: 1.15rem; font-weight: 900; }
    .theme-size { font-size: 11px; font-weight: 800; background: rgba(0,0,0,.5); border-radius: 6px; padding: 1px 6px; vertical-align: middle; white-space: nowrap; }
    .theme-desc { font-size: 12px; font-weight: 600; text-align: center; background: rgba(0,0,0,.45); border-radius: 8px; padding: .3rem .5rem; }
    .setup-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }

    /* Выбор карты (src/client/mapPicker.ts): фильтры · список · карточка с тактическим планом */
    .map-picker { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: .6rem; }
    .map-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; }
    .map-filters .chip.random { border-style: dashed; }
    .map-body { display: grid; grid-template-columns: minmax(210px, 280px) 1fr; gap: .8rem; align-items: start; }
    .map-list { display: flex; flex-direction: column; gap: 4px; max-height: min(56vh, 470px); overflow-y: auto; padding-right: 4px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; }
    .map-list::-webkit-scrollbar { width: 6px; height: 6px; }
    .map-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); border-radius: 3px; }
    .map-list::-webkit-scrollbar-track { background: transparent; }
    .map-item {
      display: grid; grid-template-columns: 1.7em 1fr auto; align-items: center; gap: .45em; flex: 0 0 auto;
      padding: .5em .65em; border-radius: 10px; border: 2px solid transparent; background: rgba(0,0,0,.32);
      color: #fff; text-align: left; cursor: pointer; font: 700 14px system-ui, sans-serif;
    }
    .map-item:hover { background: rgba(255,255,255,.08); }
    .map-item.selected { border-color: #ffd54f; background: rgba(255,213,79,.16); }
    .map-item-icon { font-size: 1.2em; text-align: center; }
    .map-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .map-size { font-size: 11px; font-weight: 900; border-radius: 6px; padding: 1px 6px; background: rgba(0,0,0,.45); white-space: nowrap; }
    .map-size.s-S { color: #ff8a65; } .map-size.s-M { color: #ffd54f; } .map-size.s-L { color: #81c784; }
    .map-detail { display: grid; grid-template-columns: auto 1fr; gap: .9rem; background: rgba(0,0,0,.35); border-radius: 14px; padding: .8rem; }
    .map-plan { width: clamp(220px, 30vw, 290px); height: clamp(220px, 30vw, 290px); border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
    .map-info { display: flex; flex-direction: column; gap: .45rem; min-width: 0; }
    .map-title { font-size: clamp(18px, 3.4vmin, 26px); font-weight: 900; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .map-battle { font-size: 13px; font-weight: 700; color: #ffe082; }
    .map-desc { font-size: 14px; line-height: 1.35; opacity: .95; }
    .map-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .map-tag { font-size: 12px; font-weight: 800; border-radius: 8px; padding: .2em .6em; background: rgba(255,255,255,.12); }
    .map-tag.combat-close { background: rgba(239,83,80,.35); }
    .map-tag.combat-mid { background: rgba(255,213,79,.3); }
    .map-tag.combat-long { background: rgba(102,187,106,.35); }
    .map-hint { font-size: 13px; line-height: 1.35; background: rgba(255,213,79,.12); border-left: 3px solid #ffd54f; border-radius: 6px; padding: .35rem .55rem; }
    .map-legend { font-size: 11px; opacity: .75; display: flex; align-items: center; flex-wrap: wrap; gap: .25rem; }
    .map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
    @media (max-width: 720px) {
      .map-body { grid-template-columns: 1fr; }
      .map-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; max-height: none; padding: 0 0 4px; }
      .map-item { grid-template-columns: auto auto auto; font-size: 13px; padding: .4em .55em; }
      .map-detail { grid-template-columns: 1fr; justify-items: center; }
      .map-plan { width: min(78vw, 300px); height: min(78vw, 300px); }
      .map-info { width: 100%; }
    }
    .setup-group { display: flex; align-items: center; gap: .6rem; font-weight: 700; }
    .chips { display: flex; gap: .4rem; }
    .chip {
      cursor: pointer; border: 2px solid rgba(255,255,255,.25); border-radius: 999px; padding: .35rem .9rem;
      background: rgba(0,0,0,.4); color: #fff; font: 700 14px system-ui, sans-serif;
    }
    .chip:disabled { opacity: .55; cursor: default; }
    .ff-note { margin: 0; align-self: center; }
    .menu-nav { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; }
    .menu-btn {
      cursor: pointer; border: 0; border-radius: 10px; padding: .7rem 1.4rem; pointer-events: auto;
      background: #ffd54f; color: #3e2723; font: 800 16px system-ui, sans-serif;
    }
    .menu-btn.secondary { background: rgba(255,255,255,.15); color: #fff; }
  </style>
</body>
</html>
